name: Job Alert Scanner

on:
  schedule:
    # Runs every hour automatically
    - cron: '0 * * * *'
  workflow_dispatch: # Allows you to manually trigger it anytime

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Job Scanner
        run: python run_once.py